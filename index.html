<meta charset="utf-8">
<title>에테르 크로니클</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121731">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="에테르">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: 전체 화면 캔버스 위에 얇은 HUD·미니맵·퀘스트 추적·조작 버튼·메뉴 오버레이를 겹치는 단일 화면 게임 */
:root{
  --ink:#121731;
  --panel:rgba(18,24,52,.78);
  --panel-solid:#171d3d;
  --line:rgba(150,180,255,.22);
  --text:#eef1ff;
  --muted:#a7b0d8;
  --aether:#76e0d1;
  --gold:#f0c674;
  --hp:#ef5d7d;
  --mp:#5aa2ff;
  --xp:#a58cff;
  --up:#7ee08f;
  --down:#ff7b8f;
  --f-display:'Song Myung','Nanum Myeongjo','Batang',serif;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none !important;}
html,body{height:100%;}
body{background:var(--ink);color:var(--text);font-family:var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#app{position:fixed;inset:0;touch-action:none;}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;}
button{font-family:inherit;cursor:pointer;color:var(--text);}
button:focus-visible{outline:2px solid var(--aether);outline-offset:2px;}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;}
.hl,.hr{display:grid;gap:6px;min-width:0;}
.hr{justify-items:end;}
.pstat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px 6px;width:min(200px,40vw);display:grid;gap:3px;}
.pname{display:flex;gap:6px;align-items:baseline;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;}
.pname .lv{color:var(--gold);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;}
.pname #hClass{overflow:hidden;text-overflow:ellipsis;color:var(--muted);}
.bar{position:relative;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .12s linear;}
.bar.hp{height:12px;} .bar.hp i{background:linear-gradient(90deg,#c9385c,var(--hp));}
.bar.mp{height:5px;} .bar.mp i{background:linear-gradient(90deg,#3a6fd6,var(--mp));}
.bar.xp{height:3px;} .bar.xp i{background:linear-gradient(90deg,#7b63e6,var(--xp));}
.bar span{position:relative;display:block;text-align:center;font-size:9px;line-height:12px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000;}
.party{display:grid;gap:3px;width:min(200px,40vw);}
.pm{display:grid;grid-template-columns:24px minmax(0,1fr);gap:5px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 6px 2px 2px;}
.pm canvas{width:24px;height:24px;display:block;}
.pm .pn{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pm .pb{display:block;height:3px;border-radius:2px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:2px;}
.pm .pb b{display:block;height:100%;background:var(--up);}
.pm.out{opacity:.45;}
.party .sum{pointer-events:auto;justify-self:start;font-size:11px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);}
.meta{display:flex;gap:4px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;}
.meta button{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:12px;}
.meta #btnAutoBattle.on{background:linear-gradient(180deg,rgba(118,224,209,.55),rgba(118,224,209,.25));border-color:var(--aether);color:#fff;font-weight:700;box-shadow:0 0 10px rgba(118,224,209,.45);}
.meta button .dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);}
#minimap{pointer-events:auto;width:120px;height:120px;border-radius:10px;border:1px solid var(--line);background:rgba(10,20,14,.6);display:block;cursor:pointer;}
#minimap.big{width:210px;height:210px;}
body.touch #minimap{width:92px;height:92px;}
body.touch #minimap.big{width:180px;height:180px;}
#tracker{pointer-events:auto;width:min(190px,44vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:grid;gap:3px;text-align:left;font-size:11px;line-height:1.35;}
#tracker .qt{font-weight:700;color:var(--gold);display:flex;gap:5px;align-items:baseline;}
#tracker .qt i{font-style:normal;font-size:9px;color:#141830;background:var(--gold);border-radius:4px;padding:0 4px;flex-shrink:0;}
#tracker .qt i.sub{background:var(--aether);}
#tracker .g{color:var(--muted);display:flex;justify-content:space-between;gap:6px;}
#tracker .g.ok{color:var(--up);}
#tracker .g b{font-weight:600;font-variant-numeric:tabular-nums;}
body.touch #tracker{width:min(160px,42vw);font-size:10px;}
#tracker{position:relative;}
#tracker.auto-on{border-color:var(--aether);box-shadow:0 0 0 1px var(--aether);}
#trkMain{all:unset;display:grid;gap:3px;cursor:pointer;width:100%;box-sizing:border-box;}
#trkMain:focus-visible{outline:2px solid var(--aether);outline-offset:2px;}
#trkFold{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:5px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:12px;line-height:1;padding:0;}
#tracker .qt{padding-right:22px;}
#tracker .auto{font-size:10px;color:var(--aether);margin-top:2px;}
#tracker .auto.on{color:#0d2422;background:var(--aether);border-radius:5px;padding:2px 6px;font-weight:700;}
#tracker .bufs{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px;}
#tracker .bufs i{font-style:normal;font-size:9px;border-radius:4px;padding:1px 4px;color:#141830;background:var(--ec);}

/* 알림 문구: 화면 맨 아래 왼쪽, 작은 글씨 한두 줄. 최신 문구가 가장 아래 */
#feed{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(4px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:flex-end;gap:1px;pointer-events:none;
  width:min(340px,calc(100% - 252px));min-width:118px;}
body:not(.touch) #feed{width:min(380px,calc(100% - 210px));}
.feed-item{background:linear-gradient(90deg,rgba(8,11,26,.72),rgba(8,11,26,.35) 80%,transparent);border-left:2px solid var(--c,var(--line));border-radius:2px;padding:1px 7px;
  font-size:10px;line-height:1.4;color:#d9def0;text-shadow:0 1px 2px #000;transition:opacity .5s;word-break:keep-all;overflow-wrap:anywhere;}
.feed-item:not(:last-child){opacity:.72;}
.feed-item b{color:var(--c);}
.feed-item .d{color:var(--muted);}
.feed-item .up{color:var(--up);font-weight:700;}
.feed-item .down{color:var(--down);font-weight:700;}

#hint{position:absolute;left:50%;bottom:calc(210px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:8px 16px;font-size:12px;color:var(--muted);pointer-events:none;transition:opacity .6s;width:max-content;max-width:calc(100% - 32px);text-align:center;line-height:1.5;}
#hint b{color:var(--gold);}
#toast{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.9);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;width:calc(100% - 32px);}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
#toast .big{font-family:var(--f-display);font-size:clamp(30px,6.5vw,52px);color:var(--gold);text-shadow:0 0 18px rgba(240,198,116,.6),0 2px 0 #000;}
#toast .small{margin-top:4px;font-size:13px;color:var(--text);text-shadow:0 1px 3px #000;}
#interact{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);border:1px solid rgba(240,198,116,.7);
  background:rgba(30,26,12,.88);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;}
#interact kbd{font-family:inherit;font-size:11px;border:1px solid var(--gold);border-radius:5px;padding:0 5px;margin-right:6px;color:var(--gold);}
body.touch #interact kbd{display:none;}
#bossbar{position:absolute;left:50%;bottom:calc(250px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,calc(100% - 32px));pointer-events:none;text-align:center;}
#bossbar .bn{font-family:var(--f-display);font-size:18px;color:#ffb3a6;text-shadow:0 2px 3px #000;}
#bossbar .bb{height:10px;border-radius:5px;background:rgba(0,0,0,.6);border:1px solid rgba(255,179,166,.5);overflow:hidden;margin-top:3px;}
#bossbar .bb i{display:block;height:100%;background:linear-gradient(90deg,#b8324f,#ef5d7d);}
#fade{position:absolute;inset:0;background:#05070f;opacity:0;pointer-events:none;transition:opacity .35s;}
#fade.on{opacity:1;pointer-events:auto;}

/* 조작 버튼 */
#actions{position:absolute;right:0;bottom:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.skillrow,.mainrow{display:flex;gap:9px;align-items:flex-end;}
.act{position:relative;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;padding:0;
  background:radial-gradient(circle at 35% 30%,rgba(60,70,120,.85),rgba(20,26,56,.92));touch-action:none;}
.act::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(5,8,20,.74) calc(var(--cd,0)*1turn),transparent 0);pointer-events:none;}
.act .lbl{font-weight:700;font-size:14px;position:relative;z-index:1;line-height:1.15;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.85);}
#bossbar .bn{text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.7);}
.act .key{display:block;font-size:10px;color:var(--muted);font-weight:600;}
.act .cost{display:block;font-size:9px;color:#9cc4ff;font-weight:600;}
.act.atk{width:80px;height:80px;border-color:rgba(118,224,209,.55);}
.act.dodge{width:58px;height:58px;}
.act.sk{width:54px;height:54px;border-color:var(--skc,var(--line));}
.act.sk .lbl,.act.cap .lbl,.act.mount .lbl{font-size:12px;}
.act.cap{width:54px;height:54px;border-color:rgba(118,224,209,.4);}
.act.on{transform:scale(.94);border-color:var(--aether);}
.act.nomp{filter:saturate(.3) brightness(.7);}
body:not(.touch) .act.atk{width:62px;height:62px;}
body:not(.touch) .act.dodge,body:not(.touch) .act.sk,body:not(.touch) .act.cap{width:50px;height:50px;}
body.touch .act .key{display:none;}

#stick{position:absolute;left:0;bottom:0;width:48%;height:55%;display:none;}
body.touch #stick{display:block;}
#stickBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid var(--line);background:rgba(18,24,52,.45);}
#stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(118,224,209,.55);border:2px solid var(--aether);}
#stick.fixed #stickBase{opacity:.55;} #stick.fixed.on #stickBase{opacity:1;}
/* 버튼 크기 설정 · 재사용 대기 숫자 */
#actions{transform:scale(var(--bs,1));transform-origin:right bottom;}
.act .cdn{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-size:17px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;}
.act .cdn:empty{display:none;}
.act.cooling .lbl{opacity:.35;}

/* 저장 슬롯 · 설정 */
.slots-list{display:grid;gap:10px;width:min(560px,100%);}
.slot{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.03);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;text-align:left;}
.slot.ok{border-color:rgba(118,224,209,.45);}
.slot.bad{border-color:rgba(255,120,120,.5);}
.slot .sn{font-weight:700;font-size:15px;}
.slot .sd{font-size:12px;color:var(--muted);line-height:1.5;}
.slot .sb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.slot .warn{color:#ffb4a8;}
@media (max-width:480px){.slot{grid-template-columns:minmax(0,1fr);} .slot .sb{justify-content:flex-start;}}
.set-list{display:grid;gap:8px;width:min(560px,100%);text-align:left;}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;border-bottom:1px solid var(--line);padding:8px 2px;}
.set-row .sl{font-weight:700;font-size:14px;}
.set-row .sx{font-size:11px;color:var(--muted);line-height:1.45;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.seg button{background:transparent;color:var(--muted);border:0;padding:7px 11px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;min-width:44px;}
.seg button.on{background:var(--aether);color:#0d2422;}
@media (max-width:420px){.set-row{grid-template-columns:minmax(0,1fr);}}
.save-note{font-size:12px;color:var(--muted);min-height:1.4em;}
.save-note.ok{color:var(--up);} .save-note.bad{color:#ffb4a8;}

/* 대화창 */
#dialog{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,transparent 40%,rgba(5,7,15,.65));
  padding-block:0 calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.dlg{width:min(720px,100%);background:var(--panel-solid);border:1px solid rgba(240,198,116,.45);border-radius:16px;padding:14px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:start;box-shadow:0 12px 40px rgba(0,0,0,.5);}
.dlg canvas{width:76px;height:76px;border-radius:12px;background:rgba(255,255,255,.05);display:block;}
.dlg .who{font-family:var(--f-display);font-size:20px;color:var(--gold);line-height:1.1;}
.dlg .qn{font-size:11px;color:var(--aether);margin-top:2px;}
.dlg .txt{font-size:15px;line-height:1.65;margin:8px 0 10px;min-height:3.2em;}
.dlg .rw{font-size:12px;color:var(--muted);margin:-4px 0 10px;line-height:1.5;}
.dlg .rw b{color:var(--gold);}
.dlg .row{justify-content:flex-end;}

/* 오버레이 메뉴 */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;overflow-y:auto;
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 30%,rgba(40,52,110,.55),rgba(10,13,30,.9));touch-action:pan-y;text-align:center;}
.overlay > *{flex-shrink:0;}
.eyebrow{letter-spacing:.32em;font-size:12px;color:var(--aether);font-weight:600;}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,11vw,92px);line-height:1;margin:0;text-wrap:balance;
  background:linear-gradient(180deg,#fff7df,var(--gold) 70%,#b98b3a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(118,224,209,.35));}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,6vw,40px);margin:0;color:var(--gold);text-wrap:balance;}
h3{margin:0;font-size:12px;letter-spacing:.06em;color:var(--aether);font-weight:600;}
.lead{max-width:34em;color:var(--muted);line-height:1.6;margin:0;}
.btn{border:1px solid rgba(118,224,209,.6);background:linear-gradient(180deg,rgba(118,224,209,.28),rgba(118,224,209,.08));
  border-radius:12px;padding:13px 28px;font-size:16px;font-weight:700;min-width:190px;}
.btn:hover{background:linear-gradient(180deg,rgba(118,224,209,.4),rgba(118,224,209,.14));}
.btn.ghost{border-color:var(--line);background:rgba(255,255,255,.05);font-weight:600;}
.btn.sm{min-width:0;padding:8px 14px;font-size:13px;}
.btn.warn{border-color:rgba(255,123,143,.6);background:rgba(255,123,143,.12);}
.btn.gold{border-color:rgba(240,198,116,.7);background:linear-gradient(180deg,rgba(240,198,116,.3),rgba(240,198,116,.08));}
.btn:disabled{opacity:.4;cursor:default;}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.keys{display:grid;grid-template-columns:auto auto;gap:6px 14px;font-size:13px;color:var(--muted);text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-width:600px;}
.keys b{color:var(--text);font-weight:600;white-space:nowrap;}
.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap;}
.el{font-size:11px;border-radius:999px;padding:1px 8px;font-weight:700;color:#141830;background:var(--ec);white-space:nowrap;}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(1000px,100%);}
@media (max-width:860px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:grid;gap:6px;align-content:start;min-width:0;}
.card.sel{border-color:var(--aether);box-shadow:0 0 0 1px var(--aether),0 0 24px rgba(118,224,209,.25);}
.card canvas{width:100%;height:96px;display:block;}
.card .nm{font-family:var(--f-display);font-size:24px;line-height:1;}
.card .tt{font-size:12px;color:var(--aether);}
.card .ds{font-size:12px;color:var(--muted);line-height:1.5;}
.card .sks{display:grid;gap:2px;font-size:11px;}
.card .sks span{color:var(--gold);font-weight:700;display:inline-block;width:1.3em;}
.stat{display:grid;grid-template-columns:2.6em 1fr;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.stat i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;}
.stat i::before{content:"";display:block;height:100%;width:var(--v);background:var(--gold);}
.result{display:grid;grid-template-columns:auto auto;gap:6px 20px;font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 22px;}
.result span{color:var(--muted);text-align:left;}
.result b{text-align:right;}

/* 창 공통 */
.inv{width:min(940px,100%);background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;text-align:left;}
.inv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.inv-head h2{font-size:26px;}
.inv-body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;}
@media (max-width:720px){.inv-body{grid-template-columns:minmax(0,1fr);}}
.col{display:grid;gap:10px;align-content:start;min-width:0;}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.slot{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:4px;justify-items:center;text-align:center;min-height:92px;align-content:start;}
.slot .sl{font-size:11px;color:var(--muted);}
.slot .in{font-size:11px;line-height:1.3;color:var(--rc,var(--muted));word-break:keep-all;}

.act.mount{width:54px;height:54px;background:radial-gradient(circle at 40% 30%,rgba(111,207,115,.5),rgba(20,40,30,.85));border-color:rgba(160,240,170,.7);}
.act.mount.riding{background:radial-gradient(circle at 40% 30%,rgba(255,209,102,.6),rgba(60,40,10,.85));border-color:var(--gold);box-shadow:0 0 12px rgba(240,198,116,.5);}
.meta #btnNet .cnt{display:inline-block;margin-left:3px;min-width:15px;height:15px;line-height:15px;border-radius:8px;background:var(--aether);color:#0c1a1a;font-size:10px;font-weight:700;text-align:center;padding:0 3px;}
.meta #btnNet.live{border-color:rgba(118,224,209,.6);}
.mountgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;}
.mountc{border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:5px;justify-items:center;text-align:center;background:rgba(255,255,255,.03);}
.mountc.on{border-color:var(--gold);box-shadow:0 0 12px rgba(240,198,116,.3);} .mountc canvas{width:100%;max-width:220px;height:auto;} .mountc b{font-size:13px;} .mountc .btn.sm{justify-self:center;min-width:0;} .mountc span{font-size:11px;color:var(--muted);}
.netme{display:flex;gap:6px;align-items:center;flex-wrap:wrap;} .netme label{display:flex;gap:6px;align-items:center;font-size:13px;}
.netme input{flex:1;min-width:120px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--text);font:inherit;font-size:14px;-webkit-user-select:text;user-select:text;}
.tchip.emo{font-size:20px;padding:3px 10px;}
.meta #btnSpeed{font-weight:700;min-width:30px;} .meta #btnSpeed.on{border-color:var(--gold);color:#ffe9a8;background:rgba(240,198,116,.22);}
.treebox{width:min(1040px,100%);}
.tleft{font-size:13px;color:var(--muted);} .tleft b{font-family:var(--f-display);font-size:30px;color:var(--gold);margin-right:2px;}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;}
.tcol{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;}
.tbh{display:flex;justify-content:space-between;align-items:baseline;} .tbh b{font-size:17px;color:#d6b8ff;} .tbh span{font-size:12px;color:var(--muted);}
.trow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;position:relative;}
.trow.locked .tnode{opacity:.38;} .tneed{grid-column:1/-1;font-size:11px;color:var(--muted);text-align:center;}
.tnode{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;padding:7px 8px;display:grid;gap:2px;text-align:left;position:relative;}
.tnode .tn{font-weight:700;font-size:13px;} .tnode .tr{position:absolute;right:7px;top:6px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
.tnode .td{font-size:11px;color:var(--muted);line-height:1.4;} .tnode .td i{font-style:normal;color:#9ff3e6;}
.tnode.has{border-color:rgba(201,155,255,.7);background:rgba(201,155,255,.12);} .tnode.has .tr{color:#d6b8ff;}
.tnode.full{border-color:var(--gold);background:rgba(240,198,116,.14);} .tnode.full .tr{color:var(--gold);}
.tnode.key{border-style:dashed;} .tnode.key.has{border-style:solid;box-shadow:0 0 12px rgba(240,198,116,.35);}
.tnode[aria-disabled]{cursor:default;} .tnode.nope{animation:tshake .25s;}
@keyframes tshake{25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}
#targetBox{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid rgba(240,198,116,.55);border-radius:12px;padding:4px 12px 4px 4px;pointer-events:none;min-width:200px;}
#targetBox canvas{width:44px;height:44px;border-radius:9px;background:rgba(255,255,255,.05);} .tgi{display:grid;gap:2px;min-width:0;flex:1;}
.tgi b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .tgi span{font-size:11px;color:var(--muted);} .tbar{height:6px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden;} .tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c9385c,#ff6b8a);}
@media (orientation:landscape) and (max-height:560px){#targetBox{top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));}}
body:not(.touch) #targetBox{top:calc(48px + env(safe-area-inset-top,0px));}
.set-row.hk{grid-template-columns:minmax(0,1fr);} .hkgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
.hkgrid label{display:grid;gap:3px;font-size:11px;color:var(--muted);} .hkgrid b{color:var(--gold);font-size:13px;}
.hkgrid select{background:rgba(0,0,0,.35);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px;font:inherit;font-size:12px;}
@media (max-width:520px){.hkgrid{grid-template-columns:repeat(2,minmax(0,1fr));}}
#fade.flash{background:#fff;opacity:.85;transition:none;}
@media (prefers-reduced-motion:reduce){#toast,.bar i,#fade{transition:none;}}

  let z = Math.min(W, H) / 780;
  if (H > W * 1.15) z = Math.min(W / 430, H / 900);           // 휴대폰 세로: 캐릭터가 너무 작아지지 않게 가까이

}

function nearestEnemy(maxD, fromX, fromY, exclude) {
  fromX = fromX ?? P.x; fromY = fromY ?? P.y;
  let best = null, bd = maxD;
  for (const e of enemies) {
    if (!alive(e) || (exclude && exclude.has(e))) continue;
    const d = Math.hypot(e.x - fromX, e.y - fromY) - e.r;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function aimAngle(range) {
  if (mouseAiming()) { const m = screenToWorld(input.mouseX, input.mouseY); return Math.atan2(m.y - P.y, m.x - P.x); }
  const t = nearestEnemy(range);
  return t ? Math.atan2(t.y - P.y, t.x - P.x) : P.face;
}
function aimPoint(range) {
  if (mouseAiming()) {
    const m = screenToWorld(input.mouseX, input.mouseY), d = Math.hypot(m.x - P.x, m.y - P.y);
    if (d <= range) return m;
    return { x: P.x + (m.x - P.x) / d * range, y: P.y + (m.y - P.y) / d * range };
  }
  const t = nearestEnemy(range);
  if (t) return { x: t.x, y: t.y };
  return { x: P.x + Math.cos(P.face) * range * .55, y: P.y + Math.sin(P.face) * range * .55 };
}

    ctx.fillStyle = groundPattern(curRegion);
    const gx = Math.max(0, L), gy = Math.max(0, T);
    ctx.fillRect(gx, gy, Math.min(WORLD.w, Rr) - gx, Math.min(WORLD.h, B) - gy);
    ctx.strokeStyle = reg.ancient ? '#2e2c38' : reg.cold ? '#8a9bb0' : reg.hot ? '#22110c' : reg.dark ? '#14281a' : '#2a4f2c'; ctx.lineWidth = 14; ctx.strokeRect(0, 0, WORLD.w, WORLD.h);
  }
  if (reg.cave && inView(reg.cave.x, reg.cave.y)) drawCaveMouth(ctx, reg.cave, t);
  if (reg.ruins && inView(reg.ruins.x, reg.ruins.y)) drawRuins(ctx, reg.ruins);
  if (reg.caldera && inView(reg.caldera.x, reg.caldera.y)) drawCaldera(ctx, reg.caldera, t);
  if (reg.peak && inView(reg.peak.x, reg.peak.y)) drawPeak(ctx, reg.peak, t);
  if (reg.rooms) drawPuzzles(ctx, t);
  { const rdz = regionStore[curRegion]; if (rdz && rdz.braziers) for (const b of rdz.braziers) if (inView(b.x, b.y)) drawBrazier(ctx, b, t); }
  if (reg.lava) for (const p of reg.lava) if (inView(p.x - p.rx, p.y) || inView(p.x + p.rx, p.y) || inView(p.x, p.y)) drawLava(ctx, p, t);
  if (reg.camp && inView(reg.camp.x, reg.camp.y)) drawCamp(ctx, reg.camp, t);
  for (const d of decor) if (inView(d.x, d.y)) drawDecor(ctx, d, t);
  if (hazards.length) drawHazards(ctx, t);
  // 얼음 기둥 → 보스로 이어진 보호막 줄기
  for (const e of enemies) if (e.pillar && alive(e) && e.owner && alive(e.owner)) {
    ctx.strokeStyle = `rgba(154,216,255,${.35 + Math.sin(t * 6 + e.x) * .15})`; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(e.x, e.y - 40); ctx.lineTo(e.owner.x, e.owner.y - 20); ctx.stroke(); ctx.setLineDash([]);
  }
  for (const g of reg.gates) if (inView(g.x, g.y)) drawGate(ctx, g, t);
  for (const c of chests) if (inView(c.x, c.y)) drawChest(ctx, c, t);

  for (const z of zones) {
    const zc = z.color || '255,242,196';
    ctx.fillStyle = `rgba(${zc},.14)`; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
    if (z.pull) { ctx.strokeStyle = `rgba(${zc},.6)`; ctx.lineWidth = 3; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(z.x, z.y, z.r * (.3 + i * .25), t * 3 + i, t * 3 + i + 2.2); ctx.stroke(); } }
    ctx.strokeStyle = `rgba(${zc},.45)`; ctx.lineWidth = 2; ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  }

  for (const l of loot) {
    if (!inView(l.x, l.y)) continue;
    const y = l.y - 8 + Math.sin(t * 3 + l.bob) * 3;
    if (l.kind === 'orb') {
      ctx.fillStyle = 'rgba(118,224,209,.3)'; ctx.beginPath(); ctx.arc(l.x, y, 11, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e8fffb'; ctx.beginPath(); ctx.arc(l.x, y, 6, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#76e0d1'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(l.x - 6, y); ctx.lineTo(l.x + 6, y); ctx.stroke();
      continue;
    }
    if (l.kind === 'shard') {
      ctx.fillStyle = '#8de9dc'; ctx.beginPath(); ctx.moveTo(l.x, y - 9); ctx.lineTo(l.x + 5, y); ctx.lineTo(l.x, y + 6); ctx.lineTo(l.x - 5, y); ctx.closePath(); ctx.fill();
      continue;
    }
    if (MAT_INFO[l.kind]) {
      const core = l.kind === 'core', frost = l.kind === 'frost' || l.kind === 'relic';
      ctx.fillStyle = frost ? 'rgba(154,216,255,.35)' : core ? 'rgba(255,90,60,.35)' : 'rgba(255,155,74,.3)'; ctx.beginPath(); ctx.arc(l.x, y, core ? 13 : 10, 0, TAU); ctx.fill();
      ctx.fillStyle = MAT_INFO[l.kind].color; ctx.beginPath(); ctx.moveTo(l.x, y - 9); ctx.lineTo(l.x + 7, y - 1); ctx.lineTo(l.x + 3, y + 7); ctx.lineTo(l.x - 4, y + 6); ctx.lineTo(l.x - 7, y - 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffe2a0'; ctx.beginPath(); ctx.arc(l.x + 1, y - 3, core ? 3 : 2, 0, TAU); ctx.fill();
      continue;
    }
    if (l.kind === 'quest') {
      ctx.fillStyle = 'rgba(240,198,116,.35)'; ctx.beginPath(); ctx.arc(l.x, y, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#f0c674'; ctx.beginPath(); ctx.moveTo(l.x - 6, y + 5); ctx.lineTo(l.x, y - 9); ctx.lineTo(l.x + 6, y + 5); ctx.closePath(); ctx.fill();
      continue;
    }
    const r = RARITY[l.item.rarity];
    if (l.item.rarity >= 2) {
      const g = ctx.createLinearGradient(0, l.y - 120, 0, l.y);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, r.color + '88');
      ctx.fillStyle = g; ctx.fillRect(l.x - 6, l.y - 120, 12, 120);
    }
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(l.x, l.y + 4, 12, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = r.color + '55'; ctx.beginPath(); ctx.arc(l.x, y, 15, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2a2436'; ctx.beginPath(); ctx.roundRect(l.x - 9, y - 8, 18, 16, 5); ctx.fill();
    ctx.strokeStyle = r.color; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = r.color; ctx.fillRect(l.x - 3, y - 2, 6, 4);
  }

  for (const e of enemies) {
    if (e.state !== 'windup' || !alive(e)) continue;
    const prog = 1 - e.t / e.d.windup;
    if (e.d.attack === 'lunge') {
      const len = e.spd * 3.4 * .24 + e.r + 16;
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.la);
      ctx.fillStyle = `rgba(239,70,90,${.15 + prog * .25})`; ctx.fillRect(0, -e.r, len, e.r * 2);
      ctx.fillStyle = 'rgba(239,70,90,.5)'; ctx.fillRect(0, -e.r, len * prog, e.r * 2);
      ctx.restore();
    } else if (e.d.attack === 'slam') {
      ctx.fillStyle = 'rgba(239,70,90,.14)'; ctx.beginPath(); ctx.arc(e.x, e.y, e.d.slamR, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(239,70,90,.32)'; ctx.beginPath(); ctx.arc(e.x, e.y, e.d.slamR * prog, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(239,70,90,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, e.d.slamR, 0, TAU); ctx.stroke();
    } else if (e.tgt) {
      ctx.strokeStyle = `rgba(239,70,90,${.3 + prog * .5})`; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.moveTo(e.x, e.y - 10); ctx.lineTo(e.tgt.x, e.tgt.y); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  for (const f of fx) if (f.type === 'trail') {
    ctx.strokeStyle = `rgba(${f.color},${.6 * (1 - f.t / f.life)})`; ctx.lineWidth = 14 * (1 - f.t / f.life) + 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke(); ctx.lineCap = 'butt';
  }
  for (const f of fx) if (f.type === 'ghost' && P) {
    ctx.save(); ctx.globalAlpha = .35 * (1 - f.t / f.life); ctx.translate(f.x, f.y);
    Sprites.draw(ctx, 'hero', { cls: P.cls, c: P.c, face: f.face, moving: false, walk: 0, swing: 0, spin: 0 }, t); ctx.restore();
  }

  const list = enemies.filter(e => alive(e) && inView(e.x, e.y));
  for (const id in NPCS) if (NPCS[id].region === curRegion && inView(NPCS[id].x, NPCS[id].y)) list.push(npcObj(id));
  if (playing) { list.push(P); for (const c of comps) if (isActive(c)) list.push(c); for (const o of NET.peers.values()) if (o.here && inView(o.x, o.y)) list.push(o); }
  if (playing) drawTargetRings(ctx, t);
  list.sort((a, b) => a.y - b.y);
  for (const o of list) drawEntity(o, t);
  for (const f of fx) if (f.type === 'die' && inView(f.x, f.y)) {
    const k = f.t / f.life; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k); ctx.translate(f.x, f.y + f.snap.r * .75);
    ctx.scale(1 + k * .25, Math.max(.05, 1 - k * .85)); ctx.translate(0, -f.snap.r * .75);
    Sprites.draw(ctx, f.snap.d.draw, f.snap, t); ctx.restore();
  }

  for (const c of captures) {
    const k = c.t, shakeN = Math.floor(Math.max(0, k - .4) / .45);
    const wob = k > .4 && shakeN < c.shakes ? Math.sin((k - .4) / .45 * TAU) * .5 : 0;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(wob);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, 10, 12, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(118,224,209,.35)'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8fffb'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#2b8f85'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.stroke();
    ctx.fillStyle = '#76e0d1'; ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, TAU); ctx.fill();
    ctx.restore();
    for (let i = 0; i < Math.min(shakeN, c.shakes); i++) { ctx.fillStyle = '#f0c674'; ctx.beginPath(); ctx.arc(c.x - 10 + i * 10, c.y - 26, 3, 0, TAU); ctx.fill(); }
  }

  for (const p of projs) {
    if (p.kind === 'arrow') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      if (p.big) { ctx.strokeStyle = 'rgba(255,242,196,.45)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(8, 0); ctx.stroke(); }
      ctx.strokeStyle = p.skill ? '#fff2c4' : '#f3e6c4'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(8, 0); ctx.stroke();
      ctx.fillStyle = '#dfe6f2'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(6, -4); ctx.lineTo(6, 4); ctx.fill(); ctx.restore();
    } else if (p.kind === 'orb') {
      ctx.fillStyle = 'rgba(118,224,209,.35)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 7, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c8fff6'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    } else if (p.kind === 'leaf') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a + p.t * 14);
      ctx.fillStyle = 'rgba(183,240,160,.35)'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8fd16a'; ctx.beginPath(); ctx.ellipse(0, 0, 8, 4, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = '#3f7a35'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.stroke(); ctx.restore();
    } else if (p.kind === 'beast') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); const bb = Math.sin(p.t * 30) * 2;
      ctx.fillStyle = 'rgba(183,240,160,.25)'; ctx.beginPath(); ctx.ellipse(-12, 0, 26, 14, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(214,255,200,.9)'; ctx.beginPath(); ctx.ellipse(-4, bb * .3, 14, 8, 0, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(10, bb * .3 - 2, 7, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(8, -7); ctx.lineTo(11, -15); ctx.lineTo(14, -7); ctx.fill(); ctx.fillStyle = '#2a8a58'; ctx.beginPath(); ctx.arc(13, -3, 1.6, 0, TAU); ctx.fill(); ctx.restore();
    } else if (p.kind === 'capture') {
      ctx.fillStyle = '#e8fffb'; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#2b8f85'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x - 7, p.y); ctx.lineTo(p.x + 7, p.y); ctx.stroke();
    } else {
      const col = p.kind === 'cshot' ? ELEMENTS[p.el].color : PROJ_COLOR[p.kind] || '#d9a8f5';
      ctx.fillStyle = col + '66'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 5, 0, TAU); ctx.fill();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
  }

  for (const f of fx) {
    const k = f.t / f.life;
    if (f.type === 'p') { ctx.globalAlpha = Math.max(0, 1 - k); ctx.fillStyle = f.color; ctx.fillRect(f.x - f.size / 2, f.y - f.size / 2, f.size, f.size); ctx.globalAlpha = 1; }
    else if (f.type === 'ring') { ctx.strokeStyle = f.color + (1 - k) + ')'; ctx.lineWidth = 4 * (1 - k) + 1; ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * k, 0, TAU); ctx.stroke(); }
    else if (f.type === 'boom') { ctx.fillStyle = f.color + (.4 * (1 - k)) + ')'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (.4 + .6 * Math.min(1, k * 2.5)), 0, TAU); ctx.fill(); }
    else if (f.type === 'slash') {
      const a0 = f.a - f.arc / 2, sweep = f.arc * Math.min(1, k * 1.6);
      ctx.strokeStyle = f.color; ctx.globalAlpha = .75 * (1 - k); ctx.lineWidth = 10 * (1 - k) + 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(P.x, P.y - 2, f.range * .85, a0, a0 + sweep); ctx.stroke(); ctx.globalAlpha = 1; ctx.lineCap = 'butt';
    } else if (f.type === 'spin') {
      ctx.strokeStyle = f.color; ctx.globalAlpha = .7 * (1 - k); ctx.lineWidth = 12 * (1 - k) + 2;
      const a0 = P.face + k * TAU; ctx.beginPath(); ctx.arc(P.x, P.y - 2, f.r * .85, a0, a0 + TAU * .75); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.type === 'wave') {
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
      const front = f.len * Math.min(1, k * 2.2);
      ctx.fillStyle = `rgba(210,180,120,${.35 * (1 - k)})`; ctx.fillRect(0, -40, front, 80);
      ctx.fillStyle = `rgba(255,236,190,${.8 * (1 - k)})`; ctx.fillRect(front - 10, -44, 10, 88);
      ctx.restore();
    } else if (f.type === 'bolt') {
      ctx.strokeStyle = `rgba(255,224,102,${1 - k})`; ctx.lineWidth = 3; ctx.beginPath();
      for (let i = 0; i < f.pts.length - 1; i++) {
        const a = f.pts[i], b = f.pts[i + 1]; ctx.moveTo(a.x, a.y);
        for (let s = 1; s <= 5; s++) { const q = s / 5; ctx.lineTo(a.x + (b.x - a.x) * q + (s < 5 ? rand(-9, 9) : 0), a.y + (b.y - a.y) * q + (s < 5 ? rand(-9, 9) : 0)); }
      }
      ctx.stroke();
    } else if (f.type === 'drop') {
      const y = f.y - 90 * (1 - k);
      ctx.strokeStyle = 'rgba(255,242,196,.85)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(f.x - 4, y - 18); ctx.lineTo(f.x, y); ctx.stroke();
    }
  }

  // 이름표
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const capT = playing && state === 'play' && P.orbs > 0 ? captureTarget() : null;
  for (const e of enemies) {
    if (!alive(e) || !inView(e.x, e.y) || e.boss) continue;
    const y = e.y - e.r * 1.25 - 14, bw = Math.max(36, e.r * 2.2);
    ctx.font = "600 11px 'IBM Plex Sans KR', sans-serif";
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,14,30,.85)';
    const label = `${e.shiny ? '★' : ''}${e.elite ? '정예·' + ELITE_AFFIX[e.affix].name + ' ' : ''}Lv${e.lv} ${nameOf(e)}`;
    ctx.strokeText(label, e.x + 5, y - 5); ctx.fillStyle = e.shiny || e.elite ? '#f0c674' : P && e.lv > P.level ? '#ffb3a6' : '#eef1ff'; ctx.fillText(label, e.x + 5, y - 5);
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = ELEMENTS[e.d.el].color; ctx.beginPath(); ctx.arc(e.x + 5 - tw / 2 - 7, y - 9, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(10,14,30,.8)'; ctx.fillRect(e.x - bw / 2 - 1, y - 1, bw + 2, 6);
    ctx.fillStyle = '#ef5d7d'; ctx.fillRect(e.x - bw / 2, y, bw * Math.max(0, e.hp / e.maxHp), 4);
    if (e === capT) {
      const ch = Math.round(captureChance(e) * 100);
      ctx.font = "700 11px 'IBM Plex Sans KR', sans-serif";
      const txt = `포획 ${ch}%`;
      ctx.strokeText(txt, e.x, y - 20); ctx.fillStyle = ch >= 50 ? '#7ee08f' : ch >= 25 ? '#9ff3e6' : '#ffb3a6'; ctx.fillText(txt, e.x, y - 20);
    }
  }
  for (const id in NPCS) {
    const n = NPCS[id]; if (n.region !== curRegion || !inView(n.x, n.y)) continue;
    ctx.font = "600 11px 'IBM Plex Sans KR', sans-serif"; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,14,30,.85)';
    ctx.strokeText(n.name, n.x, n.y + 32); ctx.fillStyle = '#ffe9a8'; ctx.fillText(n.name, n.x, n.y + 32);
  }
  if (playing) for (const c of comps) {
    if (!isActive(c)) continue;
    const y = c.y - c.r * 1.25 - 12, bw = Math.max(30, c.r * 2);
    ctx.font = "600 10px 'IBM Plex Sans KR', sans-serif"; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,14,30,.85)';
    const label = `Lv${c.m.lv} ${c.d.name}`;
    ctx.strokeText(label, c.x, y - 4); ctx.fillStyle = '#9ff3e6'; ctx.fillText(label, c.x, y - 4);
    ctx.fillStyle = 'rgba(10,14,30,.8)'; ctx.fillRect(c.x - bw / 2 - 1, y - 1, bw + 2, 5);
    ctx.fillStyle = '#7ee08f'; ctx.fillRect(c.x - bw / 2, y, bw * Math.max(0, c.m.hp / c.st.maxHp), 3);
  }
  if (playing && state !== 'over') {
    const y = P.y - 48;
    ctx.fillStyle = 'rgba(10,14,30,.8)'; ctx.fillRect(P.x - 21, y - 1, 42, 9);
    ctx.fillStyle = '#7ee08f'; ctx.fillRect(P.x - 20, y, 40 * P.hp / P.maxHp, 4);
    ctx.fillStyle = '#5aa2ff'; ctx.fillRect(P.x - 20, y + 5, 40 * P.mp / P.maxMp, 2);
  }

  // 던전: 가 보지 않은 방은 어둡게 가린다
  if (reg.dungeon && DUN) for (const r of DUN.rooms) if (!r.visited) { const q = r.rect; ctx.fillStyle = 'rgba(5,4,10,.86)'; ctx.fillRect(q.x - 8, q.y - 8, q.w + 16, q.h + 16); }

  for (const tx of texts) {
    const k = tx.t / tx.life, s = tx.size * (k < .15 ? 1 + (1 - k / .15) * .4 : 1);
    ctx.globalAlpha = k > .6 ? 1 - (k - .6) / .4 : 1;
    ctx.font = `700 ${s}px 'IBM Plex Sans KR', sans-serif`;
    const y = tx.y - k * 36;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,14,30,.9)'; ctx.strokeText(tx.text, tx.x, y);
    ctx.fillStyle = tx.color; ctx.fillText(tx.text, tx.x, y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 숲·동굴: 어둑한 가장자리와 반딧불
  if (reg.dark) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .7);
    g.addColorStop(0, 'rgba(5,15,10,0)'); g.addColorStop(1, 'rgba(5,15,10,.55)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 14; i++) {
      const fxp = ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1, fyp = ((Math.sin(i * 78.233) * 12543.123) % 1 + 1) % 1;
      const x = fxp * W + Math.sin(t * .6 + i) * 30, y = fyp * H + Math.cos(t * .5 + i * 2) * 24;
      ctx.fillStyle = reg.dungeon ? `rgba(201,155,255,${.3 + Math.sin(t * 3 + i) * .25})` : `rgba(220,255,150,${.35 + Math.sin(t * 3 + i) * .3})`; ctx.beginPath(); ctx.arc(x, y, 2, 0, TAU); ctx.fill();
    }
  }

  // 화산: 붉은 열기와 날아오르는 불티
  if (reg.hot) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .72);
    g.addColorStop(0, 'rgba(40,8,0,0)'); g.addColorStop(1, 'rgba(70,14,0,.45)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 16; i++) {

    const foe = enemyAt(m);
    if (foe) { P.selTarget = foe; sfx('ui'); return; }
    if (tryTap(e.clientX, e.clientY)) return;
    P.selTarget = null;
  }
}
window.addEventListener('pointermove', e => {
  if (!rightHeld || e.pointerType !== 'mouse' || state !== 'play' || !P || !mouseMode()) return;
  if (!(e.buttons & 2)) { rightHeld = false; return; }
  if (P.atkTarget) return;
  const m = screenToWorld(e.clientX, e.clientY);
  P.moveTarget = { x: clamp(m.x, 30, WORLD.w - 30), y: clamp(m.y, 30, WORLD.h - 30) };
});
window.addEventListener('pointerup', e => { if (e.button === 2) rightHeld = false; });
// 클릭한 곳으로 걷기 · 클릭한 적을 쫓아가 공격
function clickMoveControl(mv) {
  if (mv.d > .25) { P.moveTarget = null; P.atkTarget = null; return mv; }
  const out = { x: 0, y: 0, d: 0, atk: false }, t = P.atkTarget;
  if (t) {
    if (!alive(t)) { P.atkTarget = null; return out; }
    const d = dist(t, P), reach = P.c.type !== 'melee' ? P.c.range * .85 : P.c.range + t.r - 10;
    if (d > reach) { out.x = (t.x - P.x) / d; out.y = (t.y - P.y) / d; out.d = 1; }
    else { out.atk = true; P.face = Math.atan2(t.y - P.y, t.x - P.x); }
    avoidLava(out);
    return out;
  }
  const m = P.moveTarget, d = Math.hypot(m.x - P.x, m.y - P.y);
  if (d < 12) { P.moveTarget = null; return out; }
  out.x = (m.x - P.x) / d; out.y = (m.y - P.y) / d; out.d = Math.min(1, d / 36);
  // 벽에 막혀 제자리걸음이면 멈춘다
  P.cmStuck = Math.hypot(P.vx || 0, P.vy || 0) < 15 ? (P.cmStuck || 0) + 1 : 0;
  if (P.cmStuck > 50) { P.moveTarget = null; P.cmStuck = 0; }
  return out;
}

let tgtSig = '';

  const name = (t.boss ? t.bossName : (t.elite ? '정예 ' : '') + (t.shiny ? '★ ' : '') + t.d.name);

    if (FORMS[t.sp]) drawPortrait($('#tgtPic'), t.sp, { shiny: t.shiny });
  }
  $('#tgtHp').style.width = Math.max(0, t.hp / t.maxHp * 100) + '%';
}
function drawTargetRings(g, t) {
  for (const [e, col, dash] of [[P.selTarget, '240,198,116', true], [P.atkTarget, '255,107,138', false]]) {
    if (!e || !alive(e)) continue;
    g.save(); g.strokeStyle = `rgba(${col},${.7 + Math.sin(t * 6) * .2})`; g.lineWidth = 2.5; if (dash) g.setLineDash([6, 5]);
    g.beginPath(); g.ellipse(e.x, e.y + e.r * .55, e.r + 10, (e.r + 10) * .42, 0, 0, TAU); g.stroke(); g.restore();
  }
  if (P.moveTarget) { g.save(); g.strokeStyle = `rgba(118,224,209,${.5 + Math.sin(t * 8) * .2})`; g.lineWidth = 2; g.beginPath(); g.ellipse(P.moveTarget.x, P.moveTarget.y, 10, 5, 0, 0, TAU); g.stroke(); g.restore(); }
}

/* ================= GitHub Pages 등 직접 올린 주소에서 같이 하기: 채널(P2P) =================
   서버 없이 브라우저끼리 직접 연결(WebRTC). 연결 상대 찾기는 공개 Nostr 릴레이를 이용(trystero 0.26, MIT).
   같은 주소에서 같은 채널을 고른 사람끼리 서로 보인다 */
const P2P = { lib: null, room: null, act: null, ch: '', peers: new Map() };
const P2P_KEY = 'aether-chronicle.channel';
const canP2P = () => !(window.claude && typeof window.claude.use === 'function') && typeof RTCPeerConnection !== 'undefined';
const cleanCode = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9가-힣-]/g, '').slice(0, 20);
async function p2pJoin(ch) {
  ch = cleanCode(ch); if (!ch) return;
  await p2pLeave(true);
  NET.mode = 'p2p'; NET.status = 'wait'; P2P.ch = ch; netUI();
  try {
    if (!P2P.lib) { const url = URL.createObjectURL(new Blob([$('#p2pLib').textContent], { type: 'text/javascript' })); P2P.lib = await import(url); }
    const room = P2P.lib.joinRoom({ appId: 'aether-chronicle-game-v1' }, 'ch-' + ch);
    const act = room.makeAction('st');
    P2P.room = room; P2P.act = act;
    act.onMessage = (data, ctx) => {
      const id = ctx && ctx.peerId; if (!id || !isObj(data)) return;
      try { if (JSON.stringify(data).length > 3000) return; } catch (e) { return; }
      P2P.peers.set(String(id), data); p2pSync();
    };
    room.onPeerJoin = id => { if (NET.lastState) act.send(NET.lastState, { target: id }).catch(() => {}); };
    room.onPeerLeave = id => { P2P.peers.delete(String(id)); p2pSync(); };
    NET.status = 'on'; NET.sig = ''; store.set(P2P_KEY, ch);
    pushFeed(`<b>채널 ${esc(ch)}</b>에 들어왔어요 <span class="d">같은 채널의 친구가 보이면 연결된 거예요</span>`, '#9ff3e6');
  } catch (e) { console.warn(e); NET.status = 'fail'; P2P.room = null; P2P.act = null; }
  netUI();
}
async function p2pLeave(quiet) {
  const r = P2P.room; P2P.room = null; P2P.act = null; P2P.peers.clear(); p2pSync();
  if (r) { try { await r.leave(); } catch (e) { /* 무시 */ } }
  if (!quiet) { P2P.ch = ''; store.del(P2P_KEY); NET.status = 'off'; netUI(); }
}
function p2pSync() { netPeers([...P2P.peers].map(([id, pr]) => ({ peer: id, isMe: false, kind: 'viewer', guest: false, presence: pr }))); }
function p2pTabHtml() {
  const st = NET.status === 'on' ? `<span class="mok">● 채널 ${esc(P2P.ch)} 연결됨</span>` : NET.status === 'wait' ? '<span class="mnum">연결 중…</span>' : NET.status === 'fail' ? '<span class="mnum" style="color:#ff7b8f">연결 실패</span>' : '<span class="mnum">채널에 들어가지 않음</span>';
  return `<div class="mcard"><div class="mh"><b>같이 하기 · 채널</b>${st}</div>
    <div class="dd">같은 게임 주소(예: GitHub Pages)를 연 사람끼리 <b>같은 채널</b>을 고르면 서로의 캐릭터가 보여요. 친구와 비밀 채널 이름을 정해서 들어가도 돼요.</div>
    <div class="tchips">${['1', '2', '3', '4', '5'].map(c => `<button type="button" class="tchip${P2P.ch === c && NET.status !== 'off' ? ' on' : ''}" data-m="ch-${c}">채널 ${c}</button>`).join('')}</div>
    <div class="netme"><input id="chCode" maxlength="20" placeholder="비밀 채널 이름 (영문 · 숫자 · 한글)"><button type="button" class="btn sm gold" data-m="chjoin">입장</button>${NET.status !== 'off' ? '<button type="button" class="btn sm ghost" data-m="chleave">나가기</button>' : ''}</div>
    <div class="netme"><label>내 이름 <input id="netNick" maxlength="10" value="${esc(myNick())}"></label><button type="button" class="btn sm" data-m="nick">바꾸기</button></div>
    <ul class="rules"><li>서버 없이 기기끼리 직접 연결(P2P)해요. 학교 · 회사 와이파이처럼 막힌 네트워크에서는 연결이 안 될 수 있어요.</li><li>연결되면 상대에게 내 인터넷 주소(IP)가 전달될 수 있으니 아는 사람끼리 쓰세요.</li><li>같은 지역에 있으면 서로 보이고, 가까이 있으면 함께 사냥 보너스(경험치 +20%, 공격력 +10%). 몬스터와 보상은 각자 따로예요.</li></ul></div>`;
}
